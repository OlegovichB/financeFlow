
name: financeflow-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: financeflow
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - postgres_prod_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U financeflow -d financeflow
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://postgres:5432/financeflow
      DB_USERNAME: financeflow
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # Local HTTP testing only.
      # Remove this override before public HTTPS deployment.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      - backend

volumes:
  postgres_prod_data:
