spring.application.name=financeflow-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/financeflow
spring.datasource.username=financeflow
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080
